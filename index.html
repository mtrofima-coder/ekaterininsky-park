<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Екатерининский парк — Учёт смен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --paper: #ffffff;
    --line: #e5e5e5;
    --muted: #8a8a8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', 'Golos Text', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 32px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .eyebrow {
    font-size: 13px; letter-spacing: 0.04em;
    color: var(--muted); margin-bottom: 10px; font-weight: 500;
  }
  h1 {
    font-family: 'Geist', 'Golos Text', sans-serif; font-style: normal;
    font-size: 38px; line-height: 1.08; font-weight: 650;
    color: var(--ink);
    margin: 0 0 32px; letter-spacing: -0.025em;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }

  .search-box { position: relative; margin-bottom: 32px; }
  #employeeSearch {
    width: 100%; padding: 14px 4px; border: none; border-bottom: 1.5px solid var(--ink);
    background: transparent; color: var(--ink); font-family: 'Geist', 'Golos Text', sans-serif;
    font-size: 16px; font-weight: 500;
  }
  #employeeSearch:focus { outline: none; }
  #employeeSearch::placeholder { color: var(--muted); font-weight: 400; }
  #employeeSearch:disabled { color: var(--muted); }
  .search-results {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 10;
    background: var(--paper); border: 1.5px solid var(--ink); border-top: none;
    max-height: 260px; overflow-y: auto; display: none;
  }
  .search-results.show { display: block; }
  .search-item {
    padding: 12px 14px; font-size: 14px; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover, .search-item:active { background: #f2f2f2; }
  .search-empty { padding: 12px 14px; font-size: 13px; color: var(--muted); }

  .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
  button {
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
    padding: 16px; font-family: 'Geist', 'Golos Text', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; flex: 1;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    opacity: 0; transform: translateX(-16px); animation: slideIn 0.5s ease forwards;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.97); }
  #startBtn { animation-delay: 0.15s; }
  #endBtn { animation-delay: 0.3s; }
  #nightStartBtn { animation-delay: 0.45s; }
  #nightEndBtn { animation-delay: 0.6s; }
  .btn-row-night { margin-top: 4px; }
  .btn-outline-muted {
    background: var(--ink); color: var(--paper); border-color: var(--ink); font-size: 13px;
  }
  .btn-outline-muted:hover { background: #2a2a2a; }
  .btn-solid { background: var(--ink); color: var(--paper); }
  .btn-solid:hover { background: #2a2a2a; }
  button:not(.btn-solid):not(.btn-outline-muted):hover { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: 0.3 !important; cursor: not-allowed; }
  @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  video, canvas, img.preview { width: 100%; margin-top: 20px; display: none; background: #000; }
  canvas { display: none !important; }

  /* Рабочие кнопки процесса — всегда полностью видимы, без анимаций появления */
  .btn-capture {
    width: 100%; margin-top: 14px; display: none;
    background: var(--ink); color: var(--paper);
    opacity: 1 !important; transform: none !important; animation: none !important;
  }
  .btn-capture.show { display: block; }
  .btn-capture:hover { background: #2a2a2a; }

  textarea {
    width: 100%; padding: 12px 0; border: none; border-bottom: 1.5px solid var(--line);
    background: transparent; color: var(--ink); font-family: 'Geist', 'Golos Text', sans-serif; font-size: 14px;
    resize: none; margin-top: 18px; min-height: 60px; display: none;
  }
  textarea.show { display: block; }
  textarea:focus { outline: none; border-bottom-color: var(--ink); }
  .field-note { font-size: 11px; color: var(--muted); margin-top: 6px; display: none; }
  .field-note.show { display: block; }
  .field-note.error { color: #c0392b; }
  .retake-row { display: none; margin-top: 14px; }
  .retake-row.show { display: flex; }
  .retake-row button {
    opacity: 1 !important; transform: none !important; animation: none !important;
  }
  .status {
    margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted); line-height: 1.8; display: none;
  }
  .status.show { display: block; }
  .status b { color: var(--ink); font-weight: 600; }
  .success { margin-top: 14px; font-size: 13px; font-weight: 600; }
  .error-msg { margin-top: 14px; font-size: 13px; font-weight: 600; color: #c0392b; }
  .hidden { display: none !important; }
  .version-tag {
    margin-top: 32px; font-size: 10px; color: #c8c8c8; text-align: center;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .final-big {
    font-family: 'Geist', 'Golos Text', sans-serif; font-size: 26px; font-weight: 650;
    color: var(--ink); margin-top: 20px; line-height: 1.2;
  }
  .final-sub {
    font-size: 15px; font-weight: 700; color: #c0392b; margin-top: 8px;
  }
  .notice {
    background: #fff7e6; border: 1.5px solid #e0a800; color: #7a5c00;
    font-size: 13px; font-weight: 600; padding: 10px 14px; margin-bottom: 20px;
    line-height: 1.5;
  }
  .loading-big { color: #c0392b; font-weight: 700; font-size: 15px; line-height: 1.5; }
  textarea::placeholder { font-weight: 700; color: #444; }
  .field-note { font-weight: 700; }
  .spinner {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--ink); border-radius: 50%; animation: spin 0.7s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Учёт рабочего времени</div>
  <h1>Екатерининский парк</h1>

  <div class="notice" id="vpnNotice">Перед отметкой: выключите VPN и включите геолокацию на телефоне</div>

  <div class="loading-big" id="loadBanner"><span class="spinner"></span>Ожидайте, информация загружается…</div>

  <label for="employeeSearch">ФИО</label>
  <div class="search-box">
    <input type="text" id="employeeSearch" placeholder="Загружаем список…" autocomplete="off" disabled>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div id="actionButtons">
    <div class="btn-row">
      <button id="startBtn">Начать смену</button>
      <button id="endBtn">Закончить смену</button>
    </div>
    <div class="btn-row btn-row-night">
      <button class="btn-outline-muted" id="nightStartBtn">Начать ночную смену</button>
      <button class="btn-outline-muted" id="nightEndBtn">Закончить ночную смену</button>
    </div>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <img id="preview" class="preview" alt="Снимок">

  <button class="btn-capture" id="captureBtn">Сделать снимок</button>

  <textarea id="comment" placeholder="Опишите, что делали"></textarea>
  <div class="field-note" id="commentNote">Заполните перед отправкой</div>

  <div class="btn-row retake-row" id="retakeRow">
    <button id="retakeBtn">Переснять</button>
    <button class="btn-solid" id="submitBtn">Отправить</button>
  </div>

  <div class="status" id="status"></div>

  <div class="version-tag">версия 11</div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyN5VZ5pn97fpcD9d38QfFritTVRTDaZSUJ-9IFi8rQPfbTyck3iTABNLQoZOG07tZi/exec';
  const PHOTO_MAX_WIDTH = 1000; // сжатие фото для быстрой отправки

  const searchInput = document.getElementById('employeeSearch');
  const searchResults = document.getElementById('searchResults');
  const startBtn = document.getElementById('startBtn');
  const endBtn = document.getElementById('endBtn');
  const nightStartBtn = document.getElementById('nightStartBtn');
  const nightEndBtn = document.getElementById('nightEndBtn');
  const actionButtons = document.getElementById('actionButtons');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const preview = document.getElementById('preview');
  const captureBtn = document.getElementById('captureBtn');
  const retakeRow = document.getElementById('retakeRow');
  const retakeBtn = document.getElementById('retakeBtn');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const eyebrowEl = document.querySelector('.eyebrow');
  const commentField = document.getElementById('comment');
  const commentNote = document.getElementById('commentNote');

  let EMPLOYEES = [];
  let selectedEmp = null;
  let stream = null;
  let shiftType = null;
  let isNightShift = false;
  let locationData = null;   // { lat, lon, address }
  let locationFailed = false;
  let capturedPhoto = null;

  function log(html) {
    statusEl.innerHTML = html;
    statusEl.classList.add('show');
  }

  // === Загрузка списка сотрудников (JSONP) ===
  window.onEmployeesLoaded = function(data) {
    document.getElementById('loadBanner').style.display = 'none';
    if (data.success && data.employees.length) {
      EMPLOYEES = data.employees;
      searchInput.disabled = false;
      searchInput.placeholder = 'Начните вводить фамилию…';
    } else {
      searchInput.placeholder = 'Список пуст — проверьте вкладку "Сотрудники"';
    }
  };

  (function loadEmployees() {
    const s = document.createElement('script');
    s.src = SCRIPT_URL + '?action=employees&callback=onEmployeesLoaded&_=' + Date.now();
    s.onerror = function() {
      document.getElementById('loadBanner').style.display = 'none';
      searchInput.placeholder = 'Ошибка загрузки списка';
      log('<div class="error-msg">Не удалось загрузить список сотрудников. Обновите страницу.</div>');
    };
    document.body.appendChild(s);
  })();

  // === Поиск по ФИО ===
  searchInput.addEventListener('input', function() {
    selectedEmp = null;
    const q = searchInput.value.trim().toLowerCase();
    if (q.length < 1) {
      searchResults.classList.remove('show');
      return;
    }
    const matches = EMPLOYEES.filter(e => e.display.toLowerCase().includes(q)).slice(0, 8);
    searchResults.innerHTML = '';
    if (matches.length) {
      matches.forEach(emp => {
        const item = document.createElement('div');
        item.className = 'search-item';
        item.textContent = emp.display;
        item.addEventListener('click', () => {
          selectedEmp = emp;
          searchInput.value = emp.display;
          searchResults.classList.remove('show');
        });
        searchResults.appendChild(item);
      });
    } else {
      searchResults.innerHTML = '<div class="search-empty">Никого не нашли — проверьте написание</div>';
    }
    searchResults.classList.add('show');
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.search-box')) {
      searchResults.classList.remove('show');
    }
  });

  // === Специальные условия ===
  function isWeekend(date) {
    const day = date.getDay();
    return day === 0 || day === 6;
  }
  function specialShiftReason() {
    if (isNightShift) return 'Ночная смена';
    if (isWeekend(new Date())) return 'Смена в выходной день';
    return null;
  }

  // === Геолокация (обязательная) + адрес словами ===
  function requestLocation() {
    locationData = null;
    locationFailed = false;
    updateStatus();

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        locationData = {
          lat: pos.coords.latitude.toFixed(5),
          lon: pos.coords.longitude.toFixed(5),
          address: ''
        };
        updateStatus();
        updateSubmitState();
        fetchAddress(locationData.lat, locationData.lon);
      },
      (err) => {
        locationFailed = true;
        updateStatus();
        updateSubmitState();
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
    );
  }

  function fetchAddress(lat, lon, attempt) {
    attempt = attempt || 0;
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lon + '&accept-language=ru&zoom=17')
      .then(r => r.json())
      .then(data => {
        if (data && data.address) {
          const a = data.address;
          const parts = [];
          if (a.road) parts.push(a.road + (a.house_number ? ', ' + a.house_number : ''));
          else if (a.pedestrian) parts.push(a.pedestrian);
          else if (a.suburb) parts.push(a.suburb);
          if (a.city || a.town || a.village) parts.push(a.city || a.town || a.village);
          if (parts.length && locationData) {
            locationData.address = parts.join(', ');
            updateStatus();
            return;
          }
        }
        if (attempt < 3) setTimeout(() => fetchAddress(lat, lon, attempt + 1), 1500);
      })
      .catch(() => {
        if (attempt < 3) setTimeout(() => fetchAddress(lat, lon, attempt + 1), 1500);
      });
  }

  function updateSubmitState() {
    // Кнопка активна всегда; проверка локации происходит при нажатии с понятным сообщением
  }

  // === Камера ===
  async function startCamera() {
    if (!selectedEmp) {
      alert('Сначала выберите ФИО из списка');
      return;
    }
    actionButtons.classList.add('hidden');
    searchInput.disabled = true;
    video.style.display = 'block';
    captureBtn.classList.add('show');
    captureBtn.disabled = true;
    eyebrowEl.textContent = shiftType === 'start' ? 'Открываем смену' : 'Закрываем смену';
    updateStatus('<div class="loading-big"><span class="spinner"></span>Ожидайте, открываем камеру…</div>');

    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      video.srcObject = stream;
      video.onplaying = function() {
        captureBtn.disabled = false;
        updateStatus();
      };
    } catch (err) {
      log('<div class="error-msg">Не удалось получить доступ к камере: ' + err.message + '</div>');
      return;
    }

    requestLocation();
  }

  function updateStatus(extraHtml) {
    if (!selectedEmp) return;
    const time = new Date().toLocaleString('ru-RU');

    let locLine;
    if (locationData) {
      locLine = locationData.address
        ? locationData.address + ' (' + locationData.lat + ', ' + locationData.lon + ')'
        : locationData.lat + ', ' + locationData.lon;
    } else if (locationFailed) {
      locLine = '<span class="error-msg" style="margin:0">не определена — без геолокации отправка невозможна. Разрешите доступ к местоположению и обновите страницу.</span>';
    } else {
      locLine = '<span class="loading-big"><span class="spinner"></span>Ожидайте, определяем местоположение…</span>';
    }

    log(`
      <div><b>Сотрудник</b> — ${selectedEmp.fio}${selectedEmp.dolzh ? ' — ' + selectedEmp.dolzh : ''}</div>
      <div><b>Отдел</b> — ${selectedEmp.dept}</div>
      <div><b>Событие</b> — ${shiftType === 'start' ? 'Начало смены' : 'Конец смены'}${isNightShift ? ' (ночная)' : ''}</div>
      <div><b>Время</b> — ${time}</div>
      <div><b>Локация</b> — ${locLine}</div>
      ${extraHtml || ''}
    `);
  }

  startBtn.addEventListener('click', () => { shiftType = 'start'; isNightShift = false; startCamera(); });
  endBtn.addEventListener('click', () => { shiftType = 'end'; isNightShift = false; startCamera(); });
  nightStartBtn.addEventListener('click', () => { shiftType = 'start'; isNightShift = true; startCamera(); });
  nightEndBtn.addEventListener('click', () => { shiftType = 'end'; isNightShift = true; startCamera(); });

  // === Снимок (со сжатием) ===
  captureBtn.addEventListener('click', () => {
    const srcW = video.videoWidth;
    const srcH = video.videoHeight;
    const scale = Math.min(1, PHOTO_MAX_WIDTH / srcW);
    const w = Math.round(srcW * scale);
    const h = Math.round(srcH * scale);

    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);

    const timeStr = new Date().toLocaleString('ru-RU');
    const bandH = Math.floor(w / 8);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, h / 2 - bandH / 2, w, bandH);
    ctx.font = `bold ${Math.floor(w / 18)}px 'Geist', 'Golos Text', sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(timeStr, w / 2, h / 2);

    capturedPhoto = canvas.toDataURL('image/jpeg', 0.8);
    preview.src = capturedPhoto;
    preview.style.display = 'block';
    video.style.display = 'none';
    captureBtn.classList.remove('show');
    retakeRow.classList.add('show');

    if (shiftType === 'end') {
      const reason = specialShiftReason();
      if (reason) {
        commentField.classList.add('show');
        commentField.dataset.required = 'true';
        commentField.placeholder = `${reason} — обязательно опишите, что делали`;
        commentNote.classList.add('show');
        commentNote.textContent = 'Обязательно заполните комментарий перед отправкой';
      }
    }

    stream.getTracks().forEach(t => t.stop());
    updateStatus();
    updateSubmitState();
  });

  retakeBtn.addEventListener('click', () => {
    preview.style.display = 'none';
    retakeRow.classList.remove('show');
    startCamera();
  });

  // === Отправка ===
  submitBtn.addEventListener('click', () => {
    if (!capturedPhoto) {
      updateStatus('<div class="loading-big">Сначала сделайте снимок.</div>');
      return;
    }
    if (!locationData) {
      if (locationFailed) {
        updateStatus('<div class="loading-big">Без геолокации отправить нельзя. Разрешите доступ к местоположению в настройках браузера и нажмите «Переснять».</div>');
        requestLocation();
      } else {
        updateStatus('<div class="loading-big"><span class="spinner"></span>Ожидайте, определяем местоположение… После этого нажмите «Отправить» ещё раз.</div>');
      }
      return;
    }

    if (commentField.dataset.required === 'true') {
      const text = commentField.value.trim();
      if (text.length < 10) {
        commentNote.classList.add('show', 'error');
        commentNote.textContent = 'Опишите чуть подробнее, что делали (минимум пара слов)';
        commentField.focus();
        return;
      }
    }

    submitBtn.disabled = true;
    retakeBtn.disabled = true;
    updateStatus('<div class="loading-big" id="sendingRow"><span class="spinner"></span>Ожидайте, отправляем данные…</div>');

    const clientId = 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);

    const payload = {
      clientId: clientId,
      dept: selectedEmp.dept,
      fio: selectedEmp.fio,
      dolzh: selectedEmp.dolzh,
      eventType: shiftType,
      time: new Date().toISOString(),
      lat: locationData.lat,
      lon: locationData.lon,
      address: locationData.address || '',
      photoBase64: capturedPhoto,
      comment: commentField.value.trim(),
      specialReason: specialShiftReason(),
      isNightShift: isNightShift
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(() => { checkDelivery(clientId, 0); })
      .catch(() => { checkDelivery(clientId, 0); });

    function checkDelivery(id, attempt) {
      if (attempt >= 8) {
        finishSending(null);
        return;
      }
      const cbName = 'onCheck_' + attempt;
      window[cbName] = function(data) {
        delete window[cbName];
        if (data.found) {
          finishSending(data.result);
        } else {
          setTimeout(() => checkDelivery(id, attempt + 1), 2000);
        }
      };
      const s = document.createElement('script');
      s.src = SCRIPT_URL + '?action=check&id=' + encodeURIComponent(id) + '&callback=' + cbName + '&_=' + Date.now();
      s.onerror = function() {
        delete window[cbName];
        setTimeout(() => checkDelivery(id, attempt + 1), 2000);
      };
      document.body.appendChild(s);
    }

    function finishSending(result) {
      const sendingRow = document.getElementById('sendingRow');
      if (sendingRow) sendingRow.remove();

      if (result && result.success) {
        const overtimeNote = result.overtime ? ' Отмечено как переработка.' : '';
        let bigMsg;
        if (shiftType === 'start') {
          bigMsg = '<div class="final-big">✅ Смена открыта</div><div class="final-sub">Не забудьте закрыть её в конце рабочего дня!</div>';
        } else {
          bigMsg = '<div class="final-big">✅ Смена закрыта</div><div class="final-sub">Спасибо за работу!</div>';
        }
        log(statusEl.innerHTML + `<div class="success">Данные записаны.${overtimeNote}</div>` + bigMsg);
      } else if (result && !result.success) {
        log(statusEl.innerHTML + `<div class="error-msg">Ошибка: ${result.error}. Попробуйте ещё раз.</div>`);
        submitBtn.disabled = false;
        retakeBtn.disabled = false;
      } else {
        log(statusEl.innerHTML + `<div class="error-msg">Не удалось подтвердить доставку. Проверьте таблицу — запись могла сохраниться. Если нет, попробуйте ещё раз.</div>`);
        submitBtn.disabled = false;
        retakeBtn.disabled = false;
      }
    }
  });

</script>

</body>
</html>
