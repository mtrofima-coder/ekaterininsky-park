<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Екатерининский парк — Учёт смен</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --line: #e3e3e3;
    --muted: #9a9a9a;
    --accent: #C8102E;   /* алый */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Tenor Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 40px;
  }
  .wrap { width: 100%; max-width: 420px; }

  /* Плавное вплытие элементов при открытии */
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .eyebrow, h1, .notice, .search-box, label {
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .eyebrow { animation-delay: 0.05s; }
  h1 { animation-delay: 0.15s; }
  .notice { animation-delay: 0.3s; }
  label { animation-delay: 0.4s; }
  .search-box { animation-delay: 0.45s; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: 0.01em;
    margin: 0 0 30px;
  }
  .notice {
    background: var(--accent);
    border: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 16px 18px;
    margin-bottom: 30px;
    line-height: 1.9;
    color: #ffffff;
    text-align: center;
  }
  @keyframes noticePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.72; }
  }
  .notice.pulse { animation: rise 0.9s cubic-bezier(0.16,1,0.3,1) forwards, noticePulse 2.2s ease-in-out 1.2s infinite; }
  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .search-box { position: relative; margin-bottom: 36px; z-index: 50; }
  #employeeSearch {
    width: 100%;
    padding: 14px 2px;
    border: none;
    border-bottom: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: 'Tenor Sans', sans-serif;
    font-size: 16px;
  }
  #employeeSearch:focus { outline: none; }
  #employeeSearch::placeholder { color: var(--muted); }
  #employeeSearch:disabled { color: var(--muted); }
  .search-results {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
    background: var(--paper);
    border: 1px solid var(--ink); border-top: none;
    max-height: 280px; overflow-y: auto; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  }
  .search-results.show { display: block; }
  .search-item {
    padding: 14px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover, .search-item:active { background: #f6f6f6; }
  .search-empty { padding: 14px 16px; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }

  .btn-row { display: flex; gap: 12px; margin-bottom: 12px; }
  button {
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    padding: 21px 10px;
    font-family: 'Tenor Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    flex: 1;
    transition: background 0.35s ease, color 0.35s ease;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn { animation-delay: 0.55s; }
  #endBtn { animation-delay: 0.65s; }
  #nightStartBtn { animation-delay: 0.75s; }
  #nightEndBtn { animation-delay: 0.85s; }
  .btn-row-night { margin-top: 2px; }
  button:hover { background: var(--ink); color: var(--paper); }
  .btn-outline-muted { background: var(--ink); color: var(--paper); }
  .btn-outline-muted:hover { background: #2c2c2c; }
  .btn-solid { background: var(--ink); color: var(--paper); }
  .btn-solid:hover { background: #2c2c2c; }
  button:disabled { opacity: 0.25 !important; cursor: not-allowed; }

  video, canvas, img.preview {
    width: 100%; margin-top: 16px; display: none; background: #000;
    max-height: 44vh;
  }
  video { object-fit: cover; }
  img.preview { object-fit: contain; }   /* превью показывает весь кадр целиком */
  canvas { display: none !important; }

  .btn-capture {
    width: 100%; margin-top: 0; display: none;
    background: var(--ink); color: var(--paper);
    opacity: 1 !important; animation: none !important; transform: none !important;
  }
  .btn-capture.show { display: block; }
  .retake-row { display: none; margin-top: 0; }
  .retake-row.show { display: flex; }

  .action-dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    display: none;
  }
  .action-dock.show { display: block; }
  .action-dock .inner { max-width: 420px; margin: 0 auto; }
  body.docked { padding-bottom: 130px; }
  .retake-row button {
    opacity: 1 !important; animation: none !important; transform: none !important;
  }

  textarea {
    width: 100%; padding: 14px 2px;
    border: none; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--ink);
    font-family: 'Tenor Sans', sans-serif; font-size: 14px;
    resize: none; margin-top: 20px; min-height: 64px; display: none;
  }
  textarea.show { display: block; }
  textarea:focus { outline: none; border-bottom-color: var(--ink); }
  textarea::placeholder { color: var(--muted); }
  .field-note {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-top: 8px; display: none;
  }
  .field-note.show { display: block; }
  .field-note.error { color: var(--ink); }

  .status {
    margin-top: 30px; padding-top: 24px;
    border-top: 1px solid var(--line);
    font-size: 13px; color: var(
